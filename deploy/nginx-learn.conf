# learn.promptso.top → 通途（纯静态，文件在 /var/www/learn/site，由 GitHub Actions 用 rsync 推送）
# 安装：cp deploy/nginx-learn.conf /etc/nginx/sites-available/learn
#       ln -s /etc/nginx/sites-available/learn /etc/nginx/sites-enabled/learn && nginx -t && systemctl reload nginx
# 与同机的 promptso.top（default 配置）互不影响

server {
    listen 80;
    listen [::]:80;
    server_name learn.promptso.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://learn.promptso.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.promptso.top;

    ssl_certificate     /etc/letsencrypt/live/learn.promptso.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.promptso.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/learn/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 注意：子 location 里一旦写了 add_header，就不再继承上层的 add_header，所以安全头在各 location 里重复写
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # JS / CSS / 图片：页面引用时都带内容哈希版本号（?v=xxxx，Mermaid 文件名自带版本），可以长期缓存
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # HTML：每次向服务器确认是否有新版本
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }

    # 隐藏文件一律拒绝；证书验证目录用上面的 ^~ 前缀匹配，优先级高于这条正则
    location ~ /\. { deny all; return 404; }
}
